<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A1A" />
  <title>EchoFlip AI — Оффлайн</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0A0A1A;
      color: #E2E8F0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      text-align: center;
      max-width: 420px;
    }
    .icon {
      width: 80px; height: 80px; border-radius: 22px;
      background: linear-gradient(135deg, #7C3AED, #06B6D4);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; margin: 0 auto 28px;
      opacity: 0.7;
    }
    h1 {
      font-size: 28px; font-weight: 800; margin-bottom: 12px;
      background: linear-gradient(135deg, #A78BFA, #67E8F9);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      font-size: 16px; color: rgba(255,255,255,0.5); line-height: 1.6;
      margin-bottom: 32px;
    }
    button {
      padding: 14px 32px; border-radius: 14px; border: none;
      font-size: 16px; font-weight: 700; cursor: pointer;
      background: linear-gradient(135deg, #7C3AED, #06B6D4);
      color: white; transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 24px rgba(124,58,237,0.3);
    }
    button:hover { transform: scale(1.03); }
    button:active { transform: scale(0.97); }
    .pulse {
      position: absolute; top: 15%; right: 10%;
      width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(124,58,237,0.1) 0%, transparent 70%);
      border-radius: 50%; filter: blur(60px); pointer-events: none;
    }
    .pulse2 {
      position: absolute; bottom: 10%; left: 5%;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(6,182,212,0.08) 0%, transparent 70%);
      border-radius: 50%; filter: blur(60px); pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="pulse"></div>
  <div class="pulse2"></div>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Нет подключения</h1>
    <p>EchoFlip AI требует интернет для игры. Проверьте соединение и попробуйте снова.</p>
    <button onclick="window.location.reload()">🔄 Попробовать снова</button>
  </div>
</body>
</html>
