steps:
  # ── Build: inject secrets as Docker build args ───────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    entrypoint: 'bash'
    secretEnv:
      - 'VITE_SUPABASE_URL'
      - 'VITE_SUPABASE_ANON_KEY'
      - 'VITE_GEMINI_API_KEY'
      - 'VITE_ADMIN_EMAILS'
    args:
      - '-c'
      - |
        # $BRANCH_NAME/$PROJECT_ID/$COMMIT_SHA = Cloud Build substitutions (single $)
        # $$VAR = bash local variable or secretEnv (escape Cloud Build parser with $$)
        if [ "$BRANCH_NAME" = "main" ]; then
          SVC="zvoo-prod"
        elif [ "$BRANCH_NAME" = "stage" ]; then
          SVC="zvoo-stage"
        else
          SVC="zvoo-dev"
        fi

        echo "Building $$SVC (branch: $BRANCH_NAME)"

        docker build \
          --build-arg VITE_SUPABASE_URL="$$VITE_SUPABASE_URL" \
          --build-arg VITE_SUPABASE_ANON_KEY="$$VITE_SUPABASE_ANON_KEY" \
          --build-arg VITE_GEMINI_API_KEY="$$VITE_GEMINI_API_KEY" \
          --build-arg VITE_ADMIN_EMAILS="$$VITE_ADMIN_EMAILS" \
          -t gcr.io/$PROJECT_ID/$$SVC:$COMMIT_SHA \
          -t gcr.io/$PROJECT_ID/$$SVC:latest \
          .

        echo "$$SVC" > /workspace/_service_name

  # ── Push image to Container Registry ────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SVC=$(cat /workspace/_service_name)
        docker push gcr.io/$PROJECT_ID/$$SVC:$COMMIT_SHA
        docker push gcr.io/$PROJECT_ID/$$SVC:latest

  # ── Deploy to Cloud Run ──────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SVC=$(cat /workspace/_service_name)
        gcloud run deploy $$SVC \
          --image gcr.io/$PROJECT_ID/$$SVC:$COMMIT_SHA \
          --region europe-west1 \
          --platform managed \
          --allow-unauthenticated \
          --port 8080 \
          --memory 256Mi \
          --cpu 1 \
          --min-instances 0 \
          --max-instances 3 \
          --quiet

# ── Secrets pulled from Google Secret Manager ────────────────
# Secrets are NEVER in git — they live in Secret Manager only
availableSecrets:
  secretManager:
    - versionName: projects/977321562666/secrets/ZVOO_SUPABASE_URL/versions/latest
      env: 'VITE_SUPABASE_URL'
    - versionName: projects/977321562666/secrets/ZVOO_SUPABASE_ANON_KEY/versions/latest
      env: 'VITE_SUPABASE_ANON_KEY'
    - versionName: projects/977321562666/secrets/ZVOO_GEMINI_API_KEY/versions/latest
      env: 'VITE_GEMINI_API_KEY'
    - versionName: projects/977321562666/secrets/ZVOO_ADMIN_EMAILS/versions/latest
      env: 'VITE_ADMIN_EMAILS'

options:
  logging: CLOUD_LOGGING_ONLY
